name: Code Quality and Testing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, develop, feature/*, hotfix/*, release/*, bugfix/*]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: "pip"
      - uses: pre-commit/action@v3.0.1

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: "pip"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install MigrateIt
        run: |
          pip install -e .

      - name: Copy environment variables (CI requires .env file)
        run: |
          cat .testenv > .env

      - name: Unit Pytest
        run: |
          export $(cat .env | xargs) &&
          python -m pytest -m unit

  full-tests:
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit
    strategy:
      matrix:
        include:
          - python-version: "3.13"
            postgres-version: "17"
            mysql-version: "8"
            mariadb-version: "12"
            oracle-version: "23-slim-faststart"
          - python-version: "3.14"
            postgres-version: "18"
            mysql-version: "26"
            mariadb-version: "12"
            oracle-version: "23-slim-faststart"

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: migrateit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_DATABASE: migrateit
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3317:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mariadb:
        image: mariadb:${{ matrix.mariadb-version }}
        env:
          MARIADB_DATABASE: migrateit
          MARIADB_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      oracle:
        image: gvenzl/oracle-free:${{ matrix.oracle-version }}
        env:
          ORACLE_DATABASE: migrateit
          ORACLE_PASSWORD: password
          APP_USER: oracle
          APP_USER_PASSWORD: password
        ports:
          - 1521:1521
        options: >-
          --health-cmd "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/1521' && echo OK || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install MigrateIt
        run: |
          pip install -e .

      - name: Copy environment variables (CI requires .env file)
        run: |
          cat .testenv > .env

      - name: Pytest + Coverage
        run: |
          export $(cat .env | xargs) &&
          coverage run --source=. -m pytest &&
          echo "=== Application Coverage ===" &&
          coverage report --include="migrateit/*" -m &&
          echo "=== Test Code Coverage (100% required) ===" &&
          coverage report --include="tests/*" --fail-under=100

  integration:
    runs-on: ubuntu-latest
    needs:
      - full-tests
    strategy:
      matrix:
        include:
          - python-version: "3.14"
            postgres-version: "18"
            mysql-version: "26"
            mariadb-version: "12"
            oracle-version: "23-slim-faststart"

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: migrateit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_DATABASE: migrateit
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3317:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mariadb:
        image: mariadb:${{ matrix.mariadb-version }}
        env:
          MARIADB_DATABASE: migrateit
          MARIADB_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      oracle:
        image: gvenzl/oracle-free:${{ matrix.oracle-version }}
        env:
          ORACLE_DATABASE: migrateit
          ORACLE_PASSWORD: password
          APP_USER: oracle
          APP_USER_PASSWORD: password
        ports:
          - 1521:1521
        options: >-
          --health-cmd "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/1521' && echo OK || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install MigrateIt
        run: |
          pip install -e .

      - name: Copy environment variables (CI requires .env file)
        run: |
          cat .testenv > .env

      - name: Integration Pytest
        run: |
          export $(cat .env | xargs) &&
          pytest -m integration
