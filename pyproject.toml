[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "migrateit"
version = "0.6.0"
description = "Handle database migrations with ease managing your database changes with simple SQL files."
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [{ name = "Iago Santos" }]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only"
]
dependencies = [
  "psycopg2-binary",
]

[project.scripts]
autocana = "migrateit.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["migrateit*"]

[tool.pyright]
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
deprecateTypingAliases = true
exclude = [
	"**/build",
	"**/dist",
	"**/out",
	"**/venv",
]

[tool.coverage.run]
branch = true
source = ["migrateit"]
omit = [
	"**/__init__.py",
	"**/_protocol.py",
	"main.py",
]

[tool.coverage.report]
exclude_also = [
	"pragma: no cover*",
	"import .*",
	"def __repr__",
	"if self.debug:",
	"if settings.DEBUG",
	"raise AssertionError",
	"raise NotImplementedError",
	"raise",
	"if 0:",
	"if False:",
	"if __name__ == .__main__.:",
	"if TYPE_CHECKING:",
	"class .*\\bProtocol\\):",
	"@(abc\\.)?abstractmethod",
	"logger.*",
	"-> ['\"]?NoReturn['\"]?:",
	"self.fail*",
	"def __str__",
]
